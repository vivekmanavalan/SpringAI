spring:
  application:
    name: mcpserver

  ai:
    mcp:
      server:
        protocol: streamable

    openai:
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: qwen/qwen3.7-flash
      embedding:
        enabled: false
  logging:
    level:
      org.springframework.ai: INFO

